---
- name: Verify Autobrr
  hosts: all
  become: true
  gather_facts: false

  vars:
    autobrr_verify_url: "http://127.0.0.1:{{ autobrr_container_http_port }}"

    # The name carries both the role and the scenario, like the platform does, so
    # a leftover container can never be mistaken for another scenario's.
    autobrr_verify_stock_container: "{{ inventory_hostname }}-stock-control"

    # A host port that the role's own binding does not use, for the control
    # container only. Autobrr's unconfigured self listens on 7474 inside.
    autobrr_verify_stock_port: 7475

    # The filter the round trip creates. Distinctive enough that finding it in
    # the SQLite file cannot be a coincidence.
    autobrr_verify_filter_name: molecule-round-trip-filter
    autobrr_verify_filter_match: molecule.round.trip.release-GROUP

    # An identifier nothing ever creates. Asking for it proves the read-back is a
    # lookup that discriminates, rather than a call returning whatever exists.
    autobrr_verify_absent_filter_id: 424242

    autobrr_verify_api_key_name: molecule-round-trip-key

  tasks:
    # Role defaults are not in scope in a verify play, but the version Renovate
    # bumps lives in them and is what the running container is checked against
    # below. Only leaf literals may be read out of this - anything Jinja-derived
    # would be resolved against an empty namespace.
    - name: Load the Autobrr role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: autobrr_defaults

    # ------------------------------------------------------------------
    # The unit is up and Autobrr itself is ready
    # ------------------------------------------------------------------

    - name: Wait for the Autobrr systemd service to become active (up to 180s)
      ansible.builtin.systemd_service:
        name: autobrr.service
      register: autobrr_service
      until: autobrr_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert the Autobrr systemd service is active
      ansible.builtin.assert:
        that: autobrr_service.status.ActiveState == 'active'
        fail_msg: "autobrr.service is not active ({{ autobrr_service.status.ActiveState }})"
        success_msg: "autobrr.service is active"

    - name: Retrieve the Autobrr service log for debugging
      when: autobrr_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu autobrr.service
      changed_when: false

    # `active` only says a docker client is running. Autobrr's readiness probe
    # pings its database, so this is the first answer that means the process
    # behind the unit has migrated its schema and opened its listener.
    - name: Wait for Autobrr to report itself ready (up to 5m)
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/healthz/readiness"
        status_code: [200]
        return_content: true
      register: autobrr_readiness
      until: autobrr_readiness.status | default(0) == 200
      retries: 60
      delay: 5

    - name: Assert Autobrr reports itself ready
      ansible.builtin.assert:
        that: autobrr_readiness.content | trim == 'OK'
        fail_msg: "Autobrr's readiness probe answered {{ autobrr_readiness.content | default('none') }}"
        success_msg: "Autobrr's readiness probe reaches its database and answers OK"

    - name: Read the Autobrr container the role created
      ansible.builtin.command:
        cmd: "docker container inspect {{ autobrr_molecule_container }}"
      register: autobrr_container_raw
      changed_when: false

    - name: Assert exactly one Autobrr container is there to inspect
      ansible.builtin.assert:
        that: (autobrr_container_raw.stdout | from_json) | length == 1
        fail_msg: >-
          `docker container inspect {{ autobrr_molecule_container }}` described
          {{ (autobrr_container_raw.stdout | from_json) | length }} containers, so the
          role's container is not there to be read
        success_msg: "The role's {{ autobrr_molecule_container }} container is there"

    - name: Make sense of the Autobrr container
      ansible.builtin.set_fact:
        autobrr_container: "{{ (autobrr_container_raw.stdout | from_json)[0] }}"

    - name: Read the Autobrr image the role pulled
      ansible.builtin.command:
        cmd: "docker image inspect {{ autobrr_container.Config.Image }}"
      register: autobrr_image_raw
      changed_when: false

    - name: Make sense of the Autobrr image
      ansible.builtin.set_fact:
        autobrr_image: "{{ (autobrr_image_raw.stdout | from_json)[0] }}"

    # ------------------------------------------------------------------
    # The negative control: the same image, without the role's doing
    # ------------------------------------------------------------------

    # With the role's Autobrr answering, this is what says the answers mean anything.
    # Autobrr is not an application that falls over when it is unconfigured. Left
    # entirely alone it writes itself a config.toml, migrates a fresh SQLite file
    # and serves a web UI indistinguishable from the role's - so "Autobrr answers"
    # is worth nothing here on its own, and every claim below has to rest on a
    # value this control shows Autobrr does not choose for itself.
    - name: Run the Autobrr image with none of the role's configuration
      ansible.builtin.command:
        cmd: >-
          docker run --detach --rm
          --name {{ autobrr_verify_stock_container }}
          --publish 127.0.0.1:{{ autobrr_verify_stock_port }}:7474
          {{ autobrr_container.Config.Image }}
      changed_when: true

    - name: Run the negative control with the control container cleaned up afterwards
      block:
        - name: Wait for the unconfigured Autobrr to become ready (up to 3m)
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ autobrr_verify_stock_port }}/api/healthz/readiness"
            status_code: [200]
          register: autobrr_stock_ready
          until: autobrr_stock_ready.status | default(0) == 200
          retries: 36
          delay: 5

        # The land grab, demonstrated at the image level: an Autobrr nobody has
        # onboarded hands its administrator account to whoever asks first, with
        # no credential at all. The role's own instance is checked for the same
        # thing further down, and this is what says the behavior comes with
        # Autobrr rather than with anything the role does.
        - name: Ask the unconfigured Autobrr whether it can still be claimed
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ autobrr_verify_stock_port }}/api/auth/onboard"
            status_code: [204]
          register: autobrr_stock_onboard

        - name: Claim the unconfigured Autobrr without presenting any credential
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ autobrr_verify_stock_port }}/api/auth/onboard"
            method: POST
            body_format: json
            body:
              username: "{{ autobrr_molecule_admin_username }}"
              password: "{{ autobrr_molecule_admin_password }}"
            status_code: [200]

        - name: Log in to the unconfigured Autobrr
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ autobrr_verify_stock_port }}/api/auth/login"
            method: POST
            body_format: json
            body:
              username: "{{ autobrr_molecule_admin_username }}"
              password: "{{ autobrr_molecule_admin_password }}"
            status_code: [204]
          register: autobrr_stock_login

        - name: Ask the unconfigured Autobrr what it configured for itself
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ autobrr_verify_stock_port }}/api/config"
            headers:
              Cookie: "{{ autobrr_stock_login.set_cookie | default('') | regex_search('autobrr_user_session=[^;]+') }}"
            status_code: [200]
          register: autobrr_stock_config

        - name: Assert the unconfigured Autobrr picks none of the values this scenario pins
          ansible.builtin.assert:
            that:
              - autobrr_stock_onboard.status == 204
              - autobrr_stock_config.json.port == 7474
              - autobrr_stock_config.json.log_level == 'INFO'
              - autobrr_stock_config.json.check_for_updates
              - autobrr_container_http_port != 7474
            fail_msg: >-
              Left to itself the Autobrr image reports port {{ autobrr_stock_config.json.port }},
              log level {{ autobrr_stock_config.json.log_level }} and update checks
              {{ autobrr_stock_config.json.check_for_updates }}. Those are the values this
              scenario uses as evidence of the role's configuration, so they can no longer
              be credited to it.
            success_msg: >-
              Left to itself the Autobrr image chooses port 7474, log level INFO and update
              checks on, and offers its administrator account to any anonymous caller
              ({{ autobrr_stock_onboard.status }}) - so the opposite of each, below, is the
              role's doing

      always:
        - name: Remove the unconfigured Autobrr
          ansible.builtin.command:
            cmd: "docker rm --force {{ autobrr_verify_stock_container }}"
          changed_when: true

    # ------------------------------------------------------------------
    # Everything without a credential is turned away
    # ------------------------------------------------------------------

    - name: Ask Autobrr for its configuration without credentials
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/config"
        status_code: [403]
      register: autobrr_anonymous_config

    - name: Ask Autobrr for its filters without credentials
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/filters"
        status_code: [403]
      register: autobrr_anonymous_filters

    - name: Ask Autobrr for its filters with a session that was never issued
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/filters"
        headers:
          Cookie: autobrr_user_session=deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
        status_code: [403]
      register: autobrr_forged_session

    # Autobrr answers a missing credential with 403 and a rejected API token with
    # 401. Checking both says the refusals above are decisions the auth middleware
    # makes, rather than a blanket rejection that would look the same if the API
    # were not mounted at all.
    - name: Ask Autobrr for its filters with an API token that was never issued
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/filters"
        headers:
          X-API-Token: deadbeefdeadbeefdeadbeefdeadbeef
        status_code: [401]
      register: autobrr_forged_token

    - name: Assert Autobrr turns away everyone who cannot prove who they are
      ansible.builtin.assert:
        that:
          - autobrr_anonymous_config.status == 403
          - autobrr_anonymous_filters.status == 403
          - autobrr_forged_session.status == 403
          - autobrr_forged_token.status == 401
        fail_msg: >-
          Autobrr let something through: anonymous config={{ autobrr_anonymous_config.status }},
          anonymous filters={{ autobrr_anonymous_filters.status }},
          forged session={{ autobrr_forged_session.status }},
          forged token={{ autobrr_forged_token.status }}
        success_msg: >-
          Autobrr refuses anonymous calls and forged sessions with 403 and forged API tokens
          with 401, so everything read below had to be authenticated for

    # A single-page application typically answers its own shell on every path,
    # which turns "the web UI is up" into a claim that cannot fail. Autobrr does
    # not, and that is what makes the 200 next to it worth something.
    - name: Ask Autobrr for a path that does not exist
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/molecule-no-such-path"
        follow_redirects: none
        status_code: [404]
      register: autobrr_bogus_path

    - name: Ask Autobrr for its web UI
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/"
        follow_redirects: none
        status_code: [200]
        return_content: true
      register: autobrr_web_ui

    - name: Assert Autobrr serves its web UI and only its web UI
      ansible.builtin.assert:
        that:
          - autobrr_bogus_path.status == 404
          - autobrr_web_ui.status == 200
          - "'<title>autobrr</title>' in autobrr_web_ui.content"
        fail_msg: >-
          Autobrr answered {{ autobrr_web_ui.status }} for its web UI and
          {{ autobrr_bogus_path.status }} for a path that does not exist, so a 200 is not
          evidence of anything in particular
        success_msg: >-
          Autobrr serves its web UI (200) and answers 404 for an invented path, so it is not
          a wildcard handing out its shell to everything

    # ------------------------------------------------------------------
    # The instance is un-onboarded, and onboarding closes behind us
    # ------------------------------------------------------------------

    # This is the state a freshly installed instance is left in, and the reason
    # docs/configuring-autobrr.md tells operators to create their account at once:
    # the call below needs no credential whatsoever.
    - name: Ask Autobrr whether it can still be claimed
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/auth/onboard"
        status_code: [204]
      register: autobrr_onboard_open

    - name: Claim the Autobrr the role installed
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/auth/onboard"
        method: POST
        body_format: json
        body:
          username: "{{ autobrr_molecule_admin_username }}"
          password: "{{ autobrr_molecule_admin_password }}"
        status_code: [200]
      register: autobrr_onboard

    - name: Ask Autobrr whether it can still be claimed a second time
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/auth/onboard"
        status_code: [503]
      register: autobrr_onboard_closed

    - name: Assert Autobrr onboards exactly once
      ansible.builtin.assert:
        that:
          - autobrr_onboard_open.status == 204
          - autobrr_onboard.json.message == 'user successfully created'
          - autobrr_onboard_closed.status == 503
        fail_msg: >-
          Onboarding did not behave as documented: open={{ autobrr_onboard_open.status }},
          create={{ autobrr_onboard.json | default('no body') }},
          afterwards={{ autobrr_onboard_closed.status }}
        success_msg: >-
          A freshly installed Autobrr accepts an unauthenticated onboarding call (204),
          creates the account, and then refuses further ones (503)

    - name: Log in to Autobrr with the wrong password
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/auth/login"
        method: POST
        body_format: json
        body:
          username: "{{ autobrr_molecule_admin_username }}"
          password: "not-{{ autobrr_molecule_admin_password }}"
        status_code: [403]
      register: autobrr_bad_login

    - name: Log in to Autobrr
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/auth/login"
        method: POST
        body_format: json
        body:
          username: "{{ autobrr_molecule_admin_username }}"
          password: "{{ autobrr_molecule_admin_password }}"
        status_code: [204]
      register: autobrr_login

    - name: Keep the Autobrr session cookie
      ansible.builtin.set_fact:
        autobrr_session: "{{ autobrr_login.set_cookie | default('') | regex_search('autobrr_user_session=[^;]+') }}"

    - name: Assert Autobrr issued a session only to the right password
      ansible.builtin.assert:
        that:
          - autobrr_bad_login.status == 403
          - "'autobrr_user_session=' not in (autobrr_bad_login.set_cookie | default(''))"
          - autobrr_session | length > 24
        fail_msg: >-
          Autobrr answered {{ autobrr_bad_login.status }} to the wrong password
          (cookie {{ autobrr_bad_login.set_cookie | default('none') }}) and issued
          "{{ autobrr_session }}" to the right one
        success_msg: >-
          Autobrr refuses the wrong password with 403 and no cookie, and issues a session to
          {{ autobrr_molecule_admin_username }}

    # ------------------------------------------------------------------
    # The running process is the version this role pins
    # ------------------------------------------------------------------

    - name: Ask Autobrr about itself
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/config"
        headers:
          Cookie: "{{ autobrr_session }}"
        status_code: [200]
      register: autobrr_config

    # /api/config reports the version linked into the running binary and does no
    # network I/O to work it out, so comparing it with the leaf variable Renovate
    # bumps ties the process that is actually serving to the version the role
    # claims to install. Autobrr carries the leading `v` its image tags do.
    - name: Assert the running Autobrr is the version this role installs
      ansible.builtin.assert:
        that:
          - autobrr_config.json.version == autobrr_defaults.autobrr_version
          - (autobrr_container.Config.Image | split(':') | last) == autobrr_defaults.autobrr_version
          - autobrr_image.Config.Labels['org.opencontainers.image.version'] == autobrr_defaults.autobrr_version
        fail_msg: >-
          The running Autobrr reports {{ autobrr_config.json.version }} out of image
          {{ autobrr_container.Config.Image }}
          (labelled {{ autobrr_image.Config.Labels['org.opencontainers.image.version'] | default('none') }}),
          but `autobrr_version` pins {{ autobrr_defaults.autobrr_version }}
        success_msg: >-
          The running Autobrr reports itself as {{ autobrr_config.json.version }}, out of an
          image tagged and labelled the same, which is what `autobrr_version` pins

    # ------------------------------------------------------------------
    # Configuration reaches the process, not just the files on disk
    # ------------------------------------------------------------------

    # Every one of these is a value Autobrr picks differently when it is left
    # alone - the control container above showed 7474, INFO and update checks on.
    # None of them is written into the config.toml Autobrr generates for itself;
    # the only route they have is the env file this role renders and hands to the
    # container, so Autobrr reporting them is that file arriving at the process.
    - name: Assert Autobrr is running the configuration the role rendered
      ansible.builtin.assert:
        that:
          - autobrr_config.json.port == autobrr_container_http_port
          - autobrr_config.json.host == '0.0.0.0'
          - autobrr_config.json.log_level == 'DEBUG'
          - not autobrr_config.json.check_for_updates
          - autobrr_config.json.database == 'sqlite'
          - autobrr_config.json.config_dir == '/config'
        fail_msg: >-
          Autobrr is running with {{ autobrr_config.json | string | truncate(300) }}, which is
          not what the role's env file says
        success_msg: >-
          Autobrr listens on {{ autobrr_config.json.port }} rather than its own default of
          7474, logs at {{ autobrr_config.json.log_level }} and has update checks off, because
          the role's rendered env file reached the process

    # The port also has to have reached the container's port publishing. Both are
    # driven by the one variable, and their disagreeing is what the role's bug was.
    - name: Assert the container publishes the port Autobrr is listening on
      ansible.builtin.assert:
        that:
          - ('AUTOBRR__PORT=' ~ autobrr_container_http_port) in autobrr_container.Config.Env
          - (autobrr_container_http_port ~ '/tcp') in autobrr_container.NetworkSettings.Ports
          - autobrr_container.Config.User == (autobrr_uid ~ ':' ~ autobrr_gid)
        fail_msg: >-
          The container publishes {{ autobrr_container.NetworkSettings.Ports.keys() | list }}
          and runs as {{ autobrr_container.Config.User }}, which does not line up with Autobrr
          listening on {{ autobrr_container_http_port }} as {{ autobrr_uid }}:{{ autobrr_gid }}
        success_msg: >-
          The container publishes {{ autobrr_container_http_port }}/tcp, hands Autobrr
          AUTOBRR__PORT={{ autobrr_container_http_port }}, and runs it as
          {{ autobrr_container.Config.User }}

    # Autobrr timestamps its own log lines in local time. Etc/UTC - the role's
    # default, which this scenario deliberately does not use - renders them with a
    # trailing `Z`, so an offset is TZ having reached the process rather than
    # merely the env file.
    #
    # The journal is read scoped to the invocation that is running now, because
    # it also keeps every earlier start of the unit, and a check that accepted
    # those would still pass after the timezone had been changed and the service
    # restarted.
    - name: Ask systemd which invocation of Autobrr is running
      ansible.builtin.systemd_service:
        name: autobrr.service
      register: autobrr_invocation

    - name: Read Autobrr's own log lines out of the journal
      ansible.builtin.command:
        cmd: journalctl _SYSTEMD_INVOCATION_ID={{ autobrr_invocation.status.InvocationID }} --no-pager --output cat
      register: autobrr_journal
      changed_when: false

    - name: Assert Autobrr timestamps itself in the timezone the role configured
      ansible.builtin.assert:
        that:
          - autobrr_journal.stdout is search('"time":"[0-9T:.-]+\+0[23]:00"')
          - autobrr_timezone != 'Etc/UTC'
        fail_msg: >-
          Autobrr's log lines carry no {{ autobrr_timezone }} offset, so `autobrr_timezone`
          did not reach the process
        success_msg: >-
          Autobrr timestamps its log lines with a {{ autobrr_timezone }} offset rather than
          the trailing Z that the role's default of Etc/UTC would give

    # ------------------------------------------------------------------
    # A round trip through the API, cross-checked in SQLite
    # ------------------------------------------------------------------

    # The four array fields are not optional: Autobrr's schema declares them NOT
    # NULL without a default, so a filter without them is rejected by SQLite.
    - name: Create a filter in Autobrr
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/filters"
        method: POST
        headers:
          Cookie: "{{ autobrr_session }}"
        body_format: json
        body:
          name: "{{ autobrr_verify_filter_name }}"
          enabled: true
          match_releases: "{{ autobrr_verify_filter_match }}"
          resolutions: []
          codecs: []
          sources: []
          containers: []
        status_code: [201]
      register: autobrr_created_filter

    - name: Read the filter back out of Autobrr
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/filters/{{ autobrr_created_filter.json.id }}"
        headers:
          Cookie: "{{ autobrr_session }}"
        status_code: [200]
      register: autobrr_read_filter

    - name: List the filters Autobrr holds
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/filters"
        headers:
          Cookie: "{{ autobrr_session }}"
        status_code: [200]
      register: autobrr_listed_filters

    # The same lookup for a filter nobody ever created. Without it, a read-back
    # that ignored its identifier and returned whatever it had would look exactly
    # like a working one.
    - name: Ask Autobrr for a filter that was never created
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/filters/{{ autobrr_verify_absent_filter_id }}"
        headers:
          Cookie: "{{ autobrr_session }}"
        status_code: [404]
      register: autobrr_absent_filter

    - name: Assert Autobrr stored and returned what it was given
      ansible.builtin.assert:
        that:
          - autobrr_created_filter.json.id | int > 0
          - autobrr_read_filter.json.name == autobrr_verify_filter_name
          - autobrr_read_filter.json.match_releases == autobrr_verify_filter_match
          - autobrr_read_filter.json.enabled
          - (autobrr_listed_filters.json | map(attribute='name') | list) == [autobrr_verify_filter_name]
          - autobrr_absent_filter.status == 404
          - autobrr_absent_filter.json.code == 'RECORD_NOT_FOUND'
        fail_msg: >-
          The round trip through Autobrr's API did not come back intact:
          {{ autobrr_read_filter.json | string | truncate(400) }}
          (and {{ autobrr_absent_filter.status }} for a filter never created)
        success_msg: >-
          Autobrr stored filter {{ autobrr_created_filter.json.id }} with its match
          expression, returns it for a lookup that names it, and does not return one for an
          identifier nothing ever created

    # A second way in, which is also the other half of the 401-versus-403
    # distinction asserted earlier: the token Autobrr itself issued is accepted
    # where the invented one was not.
    - name: Ask Autobrr for an API key
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/keys"
        method: POST
        headers:
          Cookie: "{{ autobrr_session }}"
        body_format: json
        body:
          name: "{{ autobrr_verify_api_key_name }}"
          scopes: []
        status_code: [201]
      register: autobrr_created_key

    - name: List the filters again, with the API key instead of the session
      ansible.builtin.uri:
        url: "{{ autobrr_verify_url }}/api/filters"
        headers:
          X-API-Token: "{{ autobrr_created_key.json.key }}"
        status_code: [200]
      register: autobrr_filters_by_key

    - name: Assert the API key Autobrr issued works where an invented one did not
      ansible.builtin.assert:
        that:
          - autobrr_created_key.json.key | length >= 32
          - (autobrr_filters_by_key.json | map(attribute='name') | list) == [autobrr_verify_filter_name]
        fail_msg: >-
          An API key Autobrr issued did not read the filter back
          ({{ autobrr_filters_by_key.json | string | truncate(200) }})
        success_msg: >-
          The API key Autobrr issued reads the same filter back, while the invented token
          earlier was refused with 401

    # Autobrr's own API could be answering out of anything it holds in memory.
    # This is the check that says the data landed in the SQLite file inside the
    # directory the role bind-mounts from the host - a path Autobrr would never
    # have chosen on its own, as the control container writing into its own
    # container filesystem showed.
    - name: Read Autobrr's database back off the host
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sqlite3, sys

            database_path, filter_name, username = sys.argv[1:4]
            connection = sqlite3.connect(database_path)

            def scalar(query, *parameters):
                # A wrong path would hand sqlite3 an empty database rather than
                # an error, so a missing table has to read as a missing value
                # and let the assertion that follows be the thing that fails.
                try:
                    row = connection.execute(query, parameters).fetchone()
                except sqlite3.OperationalError:
                    return 'MISSING'
                return 'MISSING' if row is None else str(row[0])

            print(json.dumps({
                'filter': scalar(
                    "select name || '|' || match_releases || '|' || enabled"
                    " from filter where name = ?", filter_name),
                'user': scalar(
                    'select username from users where username = ?', username),
                'tables': scalar(
                    "select count(*) from sqlite_master where type = 'table'"
                    " and name in ('filter', 'users', 'sessions', 'api_key',"
                    " 'schema_migrations')"),
                'migrations': scalar('select count(*) from schema_migrations'),
            }))

            connection.close()
          - "{{ autobrr_molecule_data_path }}/autobrr.db"
          - "{{ autobrr_verify_filter_name }}"
          - "{{ autobrr_molecule_admin_username }}"
      register: autobrr_sqlite
      changed_when: false

    - name: Make sense of what the database holds
      ansible.builtin.set_fact:
        autobrr_sqlite_facts: "{{ autobrr_sqlite.stdout | from_json }}"

    - name: Assert Autobrr's data is in the SQLite file on the path the role mounts
      ansible.builtin.assert:
        that:
          - autobrr_sqlite_facts.filter == (autobrr_verify_filter_name ~ '|' ~ autobrr_verify_filter_match ~ '|1')
          - autobrr_sqlite_facts.user == autobrr_molecule_admin_username
          - autobrr_sqlite_facts.tables == '5'
          - autobrr_sqlite_facts.migrations | int > 0
        fail_msg: >-
          {{ autobrr_molecule_data_path }}/autobrr.db does not hold what Autobrr claims to
          have stored: {{ autobrr_sqlite_facts }}
        success_msg: >-
          {{ autobrr_molecule_data_path }}/autobrr.db carries Autobrr's schema
          ({{ autobrr_sqlite_facts.migrations }} applied migrations), the account that was
          onboarded and the filter row itself ({{ autobrr_sqlite_facts.filter }})

    - name: Assert the container is fed that database off the host path the role owns
      ansible.builtin.assert:
        that:
          - >-
            (autobrr_container.Mounts | selectattr('Destination', 'equalto', '/config')
             | map(attribute='Source') | list) == [autobrr_molecule_data_path]
          - autobrr_container.HostConfig.ReadonlyRootfs
        fail_msg: >-
          The container's /config comes from
          {{ autobrr_container.Mounts | map(attribute='Source') | list }} and its root
          filesystem is
          {{ 'read-only' if autobrr_container.HostConfig.ReadonlyRootfs else 'writable' }}
        success_msg: >-
          The container's /config is a bind mount of {{ autobrr_molecule_data_path }} and its
          root filesystem is read-only, so the rows above could only have been written
          through that mount

    # ------------------------------------------------------------------
    # Nothing was quietly restarting while all of that was being checked
    # ------------------------------------------------------------------

    # `Restart=always` means the unit reads `active` while it is crash-looping.
    # The window starts here, with everything already answering, because restarts
    # from before this point say nothing.
    - name: Sample the Autobrr restart counter
      ansible.builtin.systemd_service:
        name: autobrr.service
      register: autobrr_restarts_before

    # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
    # tick at least once inside the window.
    - name: Watch the Autobrr service for 45 seconds
      ansible.builtin.pause:
        seconds: 45

    - name: Sample the Autobrr restart counter again
      ansible.builtin.systemd_service:
        name: autobrr.service
      register: autobrr_restarts_after

    - name: Assert Autobrr did not restart while it was up
      ansible.builtin.assert:
        that: autobrr_restarts_after.status.NRestarts == autobrr_restarts_before.status.NRestarts
        fail_msg: >-
          Autobrr restarted while it was supposedly up
          ({{ autobrr_restarts_before.status.NRestarts }} to
          {{ autobrr_restarts_after.status.NRestarts }}), so `active` was hiding a crash loop
        success_msg: >-
          Autobrr did not restart over 45 seconds of watching
          (restarts so far: {{ autobrr_restarts_after.status.NRestarts }})

    - name: Show the Autobrr verification summary
      ansible.builtin.debug:
        msg:
          - "Autobrr systemd: {{ autobrr_service.status.ActiveState }}, restarts {{ autobrr_restarts_after.status.NRestarts }}"
          - "Autobrr version: {{ autobrr_config.json.version }} from {{ autobrr_container.Config.Image }}"
          - "Autobrr unconfigured image: port {{ autobrr_stock_config.json.port }}, log level {{ autobrr_stock_config.json.log_level }}, update checks {{ autobrr_stock_config.json.check_for_updates }}, claimable {{ autobrr_stock_onboard.status }}"
          - "Autobrr refusals: anonymous {{ autobrr_anonymous_filters.status }}, forged session {{ autobrr_forged_session.status }}, forged token {{ autobrr_forged_token.status }}, wrong password {{ autobrr_bad_login.status }}, invented path {{ autobrr_bogus_path.status }}"
          - "Autobrr onboarding: {{ autobrr_onboard_open.status }} before, {{ autobrr_onboard_closed.status }} after"
          - "Autobrr configuration: port {{ autobrr_config.json.port }}, log level {{ autobrr_config.json.log_level }}, update checks {{ autobrr_config.json.check_for_updates }}"
          - "Autobrr round trip: filter {{ autobrr_created_filter.json.id }}, read back {{ autobrr_read_filter.json.name }}, absent lookup {{ autobrr_absent_filter.status }}"
          - "Autobrr sqlite ({{ autobrr_molecule_data_path }}/autobrr.db): {{ autobrr_sqlite_facts }}"
