---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  # The name carries both the role and the scenario, so that scenarios running
  # in parallel cannot collide on it.
  - name: autobrr-${MOLECULE_DISTRO:-ubuntu2604}-uninstall
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # The names and paths the role derives from its identifier. Role defaults
        # are not in scope in a verify play, so they are spelled out.
        autobrr_molecule_container: autobrr
        autobrr_molecule_network: autobrr
        autobrr_molecule_base_path: /autobrr
        autobrr_molecule_data_path: /autobrr/data
        autobrr_molecule_systemd_path: /etc/systemd/system

        # Variables for Autobrr
        autobrr_uid: 1000
        autobrr_gid: 1000
        autobrr_hostname: localhost
        autobrr_container_labels_traefik_enabled: false
        autobrr_container_http_port: 7654
        autobrr_container_http_bind_port: 127.0.0.1:7654
        autobrr_environment_variables_additional_variables: |
          AUTOBRR__CHECK_FOR_UPDATES=false
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
