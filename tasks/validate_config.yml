---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "autobrr_container_http_bind_port", "new": "autobrr_container_http_host_bind_port" }
    - { "old": "autobrr_timezone", "new": "autobrr_environment_variables_tz" }
    - { "old": "autobrr_container_additional_environment_variables", "new": "autobrr_environment_variables_additional_variables" }
    - { "old": "autobrr_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required Autobrr settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - autobrr_uid
    - autobrr_gid

- name: Fail if Autobrr architecture is not supported
  ansible.builtin.fail:
    msg: >-
      Your configuration specifies a CPU architecture (`{{ autobrr_arch }}`) which is not currently supported.
      This Autobrr role also does not support self-building yet, so it's not possible to make use of it.
  when: "autobrr_arch not in ['amd64', 'arm64']"

- name: Fail if Autobrr database type is invalid
  ansible.builtin.fail:
    msg: >-
      autobrr_database_type must be 'postgres' or 'sqlite'.
  when: "autobrr_database_type not in ['postgres', 'sqlite']"

- name: Run if Autobrr + Postgres integration is enabled
  when: autobrr_database_type == 'postgres'
  block:
    - name: Fail if required Autobrr + Postgres integration settings not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`) when `autobrr_database_type` is `postgres`
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - autobrr_database_password

    - name: Fail if Postgres socket host path for Autobrr is missing when Unix socket is enabled
      ansible.builtin.fail:
        msg: >-
          You need to define `autobrr_database_socket_path_host` when `autobrr_database_type` is `postgres`
          and `autobrr_database_socket_enabled` is `true`.
      when: >-
        autobrr_database_socket_enabled and
        autobrr_database_socket_path_host | string | length == 0

    - name: Fail if Postgres hostname for Autobrr is missing when Unix socket is disabled
      ansible.builtin.fail:
        msg: >-
          You need to define `autobrr_database_hostname` when `autobrr_database_type` is `postgres`
          and `autobrr_database_socket_enabled` is `false`.
      when: >-
        not autobrr_database_socket_enabled and
        autobrr_database_hostname | string | length == 0

- name: Validate Autobrr Traefik configuration
  when: autobrr_container_labels_traefik_enabled | bool
  block:
    - name: Fail if required Autobrr Traefik settings not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - autobrr_container_labels_traefik_hostname
        - autobrr_container_labels_traefik_path_prefix

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `autobrr_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if autobrr_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          autobrr_container_labels_traefik_path_prefix (`{{ autobrr_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/autobrr`).
      when: "autobrr_container_labels_traefik_path_prefix != '/' and autobrr_container_labels_traefik_path_prefix[-1] == '/'"
